<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/media/logo-64.png" />
        <link rel="apple-touch-icon" href="/media/logo-192.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0B1622" media="(prefers-color-scheme: dark)" />
        <!-- Theme before first paint (no flash): the visitor's choice, else the phone setting. -->
        <script>
            try {
                var t = localStorage.getItem("theme");
                if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
                    document.documentElement.classList.add("dark");
            } catch (e) {}
        </script>
        <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
        <title>Together We Made Power — charity fund</title>
        <meta name="description" content="Together We Made Power is a Ukrainian charity fund helping displaced families, children, hospitals, defenders and animals." />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
